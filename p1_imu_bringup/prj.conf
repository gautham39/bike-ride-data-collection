# On-board LSM6DS3TR-C IMU on i2c30 (compatible "st,lsm6dsl", alias imu0)
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y

# Polled sampling for bringup. The data-ready IRQ (P0.02) comes later; switch to
# CONFIG_LSM6DSL_TRIGGER_GLOBAL_THREAD=y to use it.
CONFIG_LSM6DSL_TRIGGER_NONE=y

# Expose the IMU die temperature on SENSOR_CHAN_DIE_TEMP
CONFIG_LSM6DSL_ENABLE_TEMP=y

# ODR and full-scale left at 0 (= selected at runtime) so main.c owns them
CONFIG_LSM6DSL_ACCEL_ODR=0
CONFIG_LSM6DSL_ACCEL_FS=0
CONFIG_LSM6DSL_GYRO_ODR=0
CONFIG_LSM6DSL_GYRO_FS=0

# Console logging over uart20 @ 115200
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Required to print sensor values with %f
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_MAIN_STACK_SIZE=2048
